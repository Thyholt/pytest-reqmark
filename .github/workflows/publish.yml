name: publish

on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml

  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked --python 3.10

      - name: Verify release tag and source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked python - <<'PY'
          import os
          from importlib.metadata import version

          expected_tag = f"v{version('pytest-reqmark')}"
          assert os.environ["RELEASE_TAG"] == expected_tag, expected_tag
          PY
          git merge-base --is-ancestor HEAD origin/master

      - run: uv run --locked pytest --tb=short -q

      - run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from 'twine>=7,<8' twine check --strict dist/*

      - run: uv venv /tmp/pypi-release-check --python 3.10

      - name: Install the built wheel
        run: >-
          uv pip install --python /tmp/pypi-release-check/bin/python
          dist/*.whl 'pytest-xdist>=3.8.0'

      - name: Verify the installed package
        working-directory: /tmp
        run: >-
          /tmp/pypi-release-check/bin/python -m pytest
          "$GITHUB_WORKSPACE/tests/acceptance"
          "$GITHUB_WORKSPACE/examples/test_examples.py" --import-mode=prepend --tb=short -q

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-reqmark/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
