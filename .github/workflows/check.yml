name: check

on:
  push:
    branches: [master]

  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pre-commit
            command: prek run --all-files

          - name: collection
            command: pytest --collect-only -q

          - name: tests
            command: pytest --tb=short -q

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked --python 3.10

      - run: uv run --locked ${{ matrix.command }}
