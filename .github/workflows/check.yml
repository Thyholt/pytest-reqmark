name: check

on:
  push:
    branches: [master]

  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pre-commit
            command: prek run --all-files

          - name: collection
            command: pytest --collect-only -q

          - name: tests
            command: pytest --cov --cov-report=term-missing --cov-report=xml --tb=short -q

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked --python 3.10

      - run: uv run --locked ${{ matrix.command }}

      - name: Upload code coverage
        if: matrix.name == 'tests'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
