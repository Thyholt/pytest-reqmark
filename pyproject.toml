[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pytest-tracereq"
version = "0.3.0"
description = "Executable acceptance criteria for pytest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8"]
license = "MIT"

[project.urls]
Repository = "https://github.com/Thyholt/pytest-tracereq"
Issues = "https://github.com/Thyholt/pytest-tracereq/issues"

[project.entry-points.pytest11]
tracereq = "tracereq.plugin"

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
    "rumdl>=0.2.79",
    "ty>=0.0.1a16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracereq"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/test_examples.py"]
addopts = "-ra -n auto"

[tool.ruff]
target-version = "py310"
line-length = 100
# Keep specification examples out of automated source formatting.
extend-exclude = ["docs/specification-v0.1.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.rumdl]
line-length = 100

[tool.ty.environment]
python-version = "3.10"
