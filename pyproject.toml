[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pytest-xspec"
version = "0.7.0"
description = "Executable acceptance criteria for pytest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8"]
license = "MIT"

[project.urls]
Repository = "https://github.com/Thyholt/pytest-xspec"
Issues = "https://github.com/Thyholt/pytest-xspec/issues"

[project.entry-points.pytest11]
xspec = "pytest_xspec.plugin"

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest-cov>=7",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
    "rumdl>=0.2.79",
    "ty>=0.0.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_xspec"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/test_examples.py"]
addopts = "-ra -n auto"

[tool.coverage.run]
branch = true
source = ["src/pytest_xspec"]
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
# Preserve the pinned upstream skill files.
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # Import sorting
    "UP",   # Python syntax upgrades
    "B",    # Bugbear
    "SIM",  # Simplification
    "C4",   # Comprehensions
    "PIE",  # Unnecessary code
    "RET",  # Return consistency
    "ARG",  # Unused arguments
    "PERF", # Performance
    "RUF",  # Ruff-specific rules
    "PGH",  # Suppression hygiene
    "ERA",  # Commented-out code
    "ANN",  # Function annotations and explicit Any
    "S",    # Bandit security checks
    "BLE",  # Blind exceptions
    "FBT",  # Boolean arguments
    "A",    # Builtin shadowing
    "PT",   # Pytest style
    "TRY",  # Exception handling
]
ignore = [
    "ANN002", # Variadic positional parameters do not require annotations.
    "ANN003", # Variadic keyword parameters do not require annotations.
    "PT023",  # Empty marker calls are valid syntax, including invalid-input scenarios.
    "TRY003", # Keep useful details beside the exception being raised.
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "FBT001"]
"examples/**/test_*.py" = ["S101"]

[tool.rumdl]
line-length = 100
# Preserve the pinned upstream prose without applying project formatting rules.
exclude = [".agents/skills/**"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
missing-type-argument = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
